  project_settings.pixels_per_unit.desc: 1 월드 유닛이 차지하는 픽셀 수. 스프라이트·물리 좌표 변환에 사용됩니다.
  project_settings.user_scripts.desc: 사용자 스크립트 소스가 저장되는 폴더 경로입니다.
  project_settings.script_build.desc: 스크립트 DLL 을 빌드할 구성. Debug 는 디버깅용, Release 는 배포용입니다.
  project_settings.script_state.desc: 라이브 컴파일 모듈의 현재 상태입니다.
  project_settings.script_auto_rebuild.desc: 에디터가 다시 포커스될 때 스크립트 소스 변경을 감지해 자동으로 다시 빌드합니다.
  project_settings.script_rebuild.desc: 지금 즉시 스크립트 DLL 을 빌드하고 다시 로드합니다.
  project_settings.script_unload.desc: 현재 로드된 스크립트 DLL 을 언로드합니다.
  build_settings.product_name.desc: 빌드 산출물 폴더와 실행 파일 이름에 사용할 제품 이름입니다.
  build_settings.windows_icon.desc: Windows 패키지 exe에 적용할 .ico 자산입니다. 외부 파일을 선택하면 Assets/Package/Windows/AppIcon.ico로 복사한 뒤 GUID를 저장합니다.
  build_settings.configuration.desc: 엔진 게임 빌드 구성입니다. Debug_Game 또는 Release_Game에 대응합니다.
  build_settings.android_application_id.desc: "Android 패키지의 고유 applicationId입니다. 예: com.company.game"
  build_settings.android_min_sdk.desc: Android 앱이 지원할 최소 SDK 버전입니다.
  build_settings.android_target_sdk.desc: Android 앱이 대상으로 하는 SDK 버전입니다. 최소 SDK보다 낮으면 저장 시 보정됩니다.
  build_settings.android_abi.desc: Android 네이티브 라이브러리를 만들 ABI입니다. 1차 모바일 목표는 arm64-v8a입니다.
  build_settings.android_orientation.desc: 게임의 초기 화면 방향입니다. Landscape/Portrait 는 방향 고정, Auto 는 기기 회전을 따릅니다. 회전 보정의 기준이 됩니다.
  build_settings.ios_bundle_identifier.desc: "iOS 앱 번들 식별자입니다. 예: com.company.game"
  build_settings.ios_team_id.desc: Apple Developer Team ID입니다. 서명 단계에서 사용합니다.
  build_settings.ios_minimum_os.desc: iOS 앱이 지원할 최소 OS 버전입니다.
  build_settings.output_directory.desc: 게임 패키지가 생성될 출력 폴더입니다. 프로젝트 내부 경로는 프로젝트 루트 기준 상대 경로로 저장합니다.
  build_settings.startup_canvas.desc: 게임 시작 시 열 캔버스입니다. Assets 폴더 내부 파일은 Assets 기준 상대 경로로 저장합니다.
  build_settings.use_current_canvas.desc: 현재 열려있는 캔버스를 시작 캔버스로 설정하고 빌드 캔버스 목록에 추가합니다.
  build_settings.package_preview.desc: 현재 설정으로 생성될 최종 패키지 폴더입니다.
  build_settings.apply.desc: 변경된 빌드 설정을 프로젝트에 저장하고 창을 닫습니다.
  build_settings.cancel.desc: 변경 사항을 버리고 창을 닫습니다.
  project_settings.language.desc: 에디터 UI 에 사용할 언어를 선택합니다.
  project_settings.audio.master_volume.desc: 게임 전체 사운드 출력의 최종 게인입니다. 0.0~2.0 범위 (1.0 = 원본 크기).
  project_settings.apply.desc: 변경된 설정을 프로젝트에 저장하고 창을 닫습니다.
  project_settings.cancel.desc: 변경 사항을 버리고 창을 닫습니다.

  inspector.slice_type.desc: 스프라이트 시트를 어떻게 잘라낼지 결정합니다. None=단일 프레임, Automatic=자동 감지, CellSize/CellCount=수동 격자.
  inspector.row_count.desc: 격자 분할 시 행(가로 줄) 개수입니다.
  inspector.column_count.desc: 격자 분할 시 열(세로 줄) 개수입니다.
  inspector.cell_width.desc: 한 셀의 가로 픽셀 크기.
  inspector.cell_height.desc: 한 셀의 세로 픽셀 크기.
  inspector.margin_x.desc: 시트 좌/우 가장자리 여백 (px).
  inspector.margin_y.desc: 시트 상/하 가장자리 여백 (px).
  inspector.gap_x.desc: 셀 사이의 가로 간격 (px).
  inspector.gap_y.desc: 셀 사이의 세로 간격 (px).
  inspector.pivot_x.desc: 스프라이트의 회전·정렬 기준점 X (0=좌, 1=우, 0.5=중앙).
  inspector.pivot_y.desc: 스프라이트의 회전·정렬 기준점 Y (0=하, 1=상, 0.5=중앙).
  inspector.pixels_per_unit.desc: 이 스프라이트의 1 월드 유닛당 픽셀 수.

  inspector.audio.mode.desc: Decompressed=메모리에 통째로 디코딩(짧은 효과음 권장), Streaming=디스크에서 점진 디코딩(긴 BGM 권장).
  inspector.audio.default_bus.desc: 이 사운드가 기본으로 출력될 버스(채널)입니다. 컴포넌트에서 인스턴스 단위로 오버라이드할 수 있습니다.
  inspector.audio.default_volume.desc: 재생 시작 시 적용될 기본 볼륨입니다. 컴포넌트가 따로 지정하지 않으면 이 값을 사용합니다.
  inspector.audio.loop.desc: 재생 종료 후 자동으로 처음부터 다시 시작합니다. 컴포넌트에서 오버라이드할 수 있습니다.
  inspector.audio.is_3d.desc: 켜면 청취자(AudioListener)와의 거리에 따라 볼륨이 감쇠됩니다. UI/BGM 은 꺼두세요.
  inspector.audio.min_distance.desc: 이 거리 이내에서는 최대 볼륨으로 재생됩니다.
  inspector.audio.max_distance.desc: 이 거리를 넘어서면 들리지 않습니다. (Min ≤ Max)

  inspector.audio.preview.play: 재생
  inspector.audio.preview.stop: 정지
  inspector.audio.preview.play.desc: 에디터 미리듣기로 이 사운드를 처음부터 재생합니다.
  inspector.audio.preview.stop.desc: 미리듣기를 정지하고 player 자원을 즉시 해제합니다.
  inspector.audio.preview.streaming_no_waveform: 스트리밍 모드 — 파형 미리보기를 표시할 수 없습니다.

