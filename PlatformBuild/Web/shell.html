<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JBroEngine Web</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
    }

    #jbro-root {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* 표시 크기는 스크립트가 백킹(렌더) 해상도의 종횡비에 맞춰 잡는다. 여기서 고정하면
       세로 해상도 프로젝트가 가로 창에 눌려 늘어난다. */
    #jbro-canvas {
      background: #151820;
      outline: none;
    }

    #jbro-error-log {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      max-width: min(720px, calc(100vw - 24px));
      max-height: 40vh;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid #7f3131;
      background: rgba(20, 8, 8, 0.92);
      color: #ffd6d6;
      font: 12px/1.45 Consolas, monospace;
      white-space: pre-wrap;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="jbro-root">
    <canvas id="jbro-canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <pre id="jbro-error-log"></pre>

  <script>
    var jbroErrorLog = document.getElementById('jbro-error-log');
    var jbroOriginalConsoleError = console.error.bind(console);

    function jbroFormatError(value) {
      if (value && value.stack) {
        return value.stack;
      }
      if (value && value.message) {
        return value.message;
      }
      return String(value);
    }

    function jbroShowError(value) {
      var text = jbroFormatError(value);
      if (jbroErrorLog) {
        jbroErrorLog.style.display = 'block';
        jbroErrorLog.textContent += (jbroErrorLog.textContent ? '\n' : '') + text;
      }
      jbroOriginalConsoleError(value);
    }

    function jbroShouldDisplayError(text) {
      return text.indexOf('WebGPU:') >= 0 ||
        text.indexOf('[ERROR]') >= 0 ||
        text.indexOf('[CRITICAL]') >= 0 ||
        text.indexOf('Unhandled promise rejection') >= 0;
    }

    console.error = function () {
      var text = Array.prototype.map.call(arguments, jbroFormatError).join(' ');
      if (jbroShouldDisplayError(text)) {
        jbroShowError(text);
      } else {
        jbroOriginalConsoleError(text);
      }
    };

    window.addEventListener('error', function (event) {
      jbroShowError(event.error || event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      jbroShowError(event.reason || 'Unhandled promise rejection');
    });

    // ── 레터박스 ───────────────────────────────────────────────────────────────
    // 캔버스 백킹 크기 = 프로젝트 해상도(엔진이 부팅 후에 잡는다). 표시 크기는 그 종횡비를
    // 유지한 채 창 안에 맞춘다 — 데스크톱 패키지·에디터 게임뷰와 같은 규칙이다.
    function jbroFitCanvas(notifyEngine) {
      var canvas = document.getElementById('jbro-canvas');
      if (!canvas || canvas.width <= 0 || canvas.height <= 0) {
        return;
      }

      var scale = Math.min(window.innerWidth / canvas.width, window.innerHeight / canvas.height);
      canvas.style.width = Math.max(1, Math.round(canvas.width * scale)) + 'px';
      canvas.style.height = Math.max(1, Math.round(canvas.height * scale)) + 'px';

      // 표시 크기가 바뀌면 입력이 쓰는 CSS→백킹 환산도 다시 잡혀야 한다. 엔진은 창 리사이즈를
      // 듣고 있으므로, 창 크기가 아니라 백킹이 바뀌어서 여기 들어온 경우에만 한 번 깨워 준다.
      if (notifyEngine) {
        window.dispatchEvent(new Event('resize'));
      }
    }

    window.addEventListener('resize', function () {
      jbroFitCanvas(false);
    });

    // 백킹 크기는 엔진 부팅 뒤에 정해진다. canvas 의 width/height 는 반영 속성이라 감시가 된다.
    new MutationObserver(function () {
      jbroFitCanvas(true);
    }).observe(document.getElementById('jbro-canvas'), {
      attributes: true,
      attributeFilter: ['width', 'height']
    });

    var Module = {
      canvas: (function () {
        return document.getElementById('jbro-canvas');
      })(),
      preRun: [function () {
        if (!navigator.gpu) {
          console.error('WebGPU is not available in this browser.');
          return;
        }

        Module.addRunDependency('jbro-webgpu-device');
        navigator.gpu.requestAdapter()
          .then(function (adapter) {
            if (!adapter) {
              throw new Error('WebGPU adapter was not found.');
            }
            return adapter.requestDevice();
          })
          .then(function (device) {
            device.addEventListener('uncapturederror', function (event) {
              jbroShowError('WebGPU: ' + jbroFormatError(event.error));
            });
            Module.preinitializedWebGPUDevice = device;
            Module.removeRunDependency('jbro-webgpu-device');
          })
          .catch(function (error) {
            console.error(error);
            Module.removeRunDependency('jbro-webgpu-device');
          });
      }],
      print: function (text) {
        console.log(text);
      },
      printErr: function (text) {
        console.error(text);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
